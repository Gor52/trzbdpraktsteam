<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Steam{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-3">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">Steam отзывы</a>
    <div class="navbar-nav">
      <a class="nav-link text-white" href="{{ url_for('index') }}">Главная</a>
      <a class="nav-link text-white" href="{{ url_for('products_page') }}">Игры</a>
      <a class="nav-link text-white" href="{{ url_for('models_page') }}">Модели</a>
      <a class="nav-link text-white" href="{{ url_for('clusters_page') }}">Кластеры</a>
    </div>
  </div>
</nav>
<div class="container pb-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
